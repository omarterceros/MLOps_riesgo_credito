<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="600" viewBox="0 0 1180 600" font-family="Segoe UI, Calibri, Arial, sans-serif">
<defs><marker id="flecha" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#444"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="590.0" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">Que le pasa a un lote nuevo: validacion de datos, data drift y concept drift</text>
