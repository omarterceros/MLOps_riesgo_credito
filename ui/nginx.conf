server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Todo lo que empieza con /api/ va al Service de la API por DNS del cluster
    location /api/ {
        proxy_pass http://riesgo-credito-api.riesgo-credito.svc.cluster.local/;
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
