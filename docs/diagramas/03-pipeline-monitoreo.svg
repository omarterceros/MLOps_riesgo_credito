<text x="685.0" y="410" text-anchor="middle" font-size="11.5" fill="#1b1b1b">o &gt; 0.12 en un lote</text>
<rect x="850" y="350" width="280" height="80" rx="7" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
