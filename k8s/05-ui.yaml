# Interfaz web (puntos extra): nginx sirve ui/index.html y hace de proxy de /api/ hacia el
# Service riesgo-credito-api por DNS interno del cluster. El navegador solo habla con la UI.
# El ConfigMap ui-archivos (04-ui-configmap.yaml) se genera desde ui/ con scripts/generar_configmap_ui.ps1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riesgo-credito-ui
  namespace: riesgo-credito
  labels:
    app: riesgo-credito-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: riesgo-credito-ui
  template:
    metadata:
      labels:
        app: riesgo-credito-ui
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: archivos
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
            - name: archivos
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 64Mi}
      volumes:
        - name: archivos
          configMap:
            name: ui-archivos
---
apiVersion: v1
kind: Service
metadata:
  name: riesgo-credito-ui
  namespace: riesgo-credito
spec:
  type: NodePort
  selector:
    app: riesgo-credito-ui
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081     # http://localhost:30081
